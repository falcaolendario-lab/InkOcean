<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07090e" />
    <title>Ink Ocean</title>
    <meta
      name="description"
      content="Livro-base de cenário e RPG de Ink Ocean."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="book" aria-label="Livro Ink Ocean">
      <figure class="page" aria-labelledby="page-1-caption">
        <img
          src="./assets/p001-capa.webp"
          width="840"
          height="1187"
          alt="Capa de Ink Ocean: uma figura de cabelos negros diante de uma cidade gótica e mágica, sob duas luas."
        />
        <figcaption id="page-1-caption">Página 1 — Capa</figcaption>
      </figure>
      <figure class="page" aria-labelledby="page-2-caption">
        <img
          src="./assets/p002-sinopse.webp"
          width="840"
          height="1187"
          alt="Sinopse ilustrada de Ink Ocean sobre um oceano mágico de tinta azul e negra, sob duas luas refletidas."
        />
        <figcaption id="page-2-caption">Página 2 — Sinopse do mundo</figcaption>
      </figure>
      <figure class="page" aria-labelledby="page-3-caption">
        <img
          src="./assets/p003-conhecendo-o-mundo.webp"
          width="840"
          height="1187"
          alt="Abertura do Capítulo I, Conhecendo o Mundo: uma rua clara e viva, com moradores, comércio, bonde mágico e pequenas maravilhas cotidianas."
        />
        <figcaption id="page-3-caption">Página 3 — Capítulo I: Conhecendo o Mundo</figcaption>
      </figure>
